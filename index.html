<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<title>VeilNet — Coming Soon</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #000;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

main {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 30px 20px;
}

h1 {
    font-size: clamp(55px, 10vw, 105px);
    font-weight: 600;
    letter-spacing: -5px;
}

.dots {
    display: flex;
    justify-content: center;
    gap: 9px;
    margin-top: 15px;
}

.dots span {
    width: 9px;
    height: 9px;
    background: white;
    border-radius: 50%;
    animation: jump 0.8s infinite ease-in-out;
}

.dots span:nth-child(2) {
    animation-delay: 0.15s;
}

.dots span:nth-child(3) {
    animation-delay: 0.3s;
}

@keyframes jump {
    0%, 60%, 100% {
        transform: translateY(0);
    }
    30% {
        transform: translateY(-12px);
    }
}

.social {
    margin-top: 35px;
    font-size: 12px;
    color: #777;
    letter-spacing: 1px;
}

.social a {
    color: #aaa;
    text-decoration: none;
    transition: color 0.2s;
}

.social a:hover {
    color: white;
}

.partners {
    margin-top: 35px;
    font-size: 13px;
    color: #aaa;
    letter-spacing: 1.5px;
    text-transform: uppercase;
}

footer {
    display: flex;
    justify-content: space-between;
    padding: 25px 35px;
    color: #555;
    font-size: 11px;
    letter-spacing: 1px;
}

@media (max-width: 500px) {
    h1 {
        letter-spacing: -3px;
    }

    footer {
        padding: 20px;
        font-size: 9px;
    }
}
</style>
</head>

<body>

<main>
    <h1>Coming Soon</h1>

    <div class="dots" aria-label="Loading">
        <span></span>
        <span></span>
        <span></span>
    </div>

    <div class="social">
        <a href="https://x.com/VeilNet_ISP"
           target="_blank"
           rel="noopener noreferrer">
            X / @VeilNet_ISP
        </a>
    </div>

    <div class="partners">
        Looking for partners.
    </div>
</main>

<footer>
    <span>© 2026 VeilNet. All rights reserved.</span>
    <span>VEILNET</span>
</footer>

</body>
</html>
